  <script>
    // Tema antes do primeiro paint: escuro por padrão, sistema na 1ª visita,
    // escolha manual persistida em localStorage.
    (function () {
      var theme = localStorage.getItem('av-theme')
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark'
      }
      document.documentElement.dataset.theme = theme
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', theme === 'light' ? '#F7F6F2' : '#0F0E0D')
    })()
  </script>
